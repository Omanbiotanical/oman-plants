<title>موسوعة النباتات العمانية</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
:root{--bg:#14110c;--gold:#c9a24b;--green:#86a08a;--ink:#1f3a2e;--cream:#fbf5e6}
html,body{height:100%;margin:0;background:var(--bg);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9}
.scr{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility .6s}
.scr.on{opacity:1;visibility:visible}
.scr img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hot:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.go{border-radius:999px;box-shadow:0 0 0 0 rgba(255,248,225,.7);animation:ring 2.4s infinite}
.go:hover{background:rgba(255,248,225,.18)}
@keyframes ring{70%{box-shadow:0 0 0 16px rgba(255,248,225,0)}100%{box-shadow:0 0 0 0 rgba(255,248,225,0)}}
.arch{border-radius:50% 50% 8px 8px/22% 22% 8px 8px;transition:background .25s,box-shadow .25s}
.arch:hover,.arch:focus-visible{background:rgba(255,236,170,.22);box-shadow:inset 0 0 0 3px rgba(255,226,140,.9),0 0 28px rgba(255,214,110,.6)}
.mb{border-radius:50%;transition:background .2s,box-shadow .2s}
.mb:hover{background:rgba(255,236,170,.2)}
.mb.cur{box-shadow:0 0 0 3px rgba(255,226,140,.95),0 0 18px rgba(255,214,110,.7)}
.play{display:block;border-radius:50%;transition:transform .2s}.play:hover{transform:scale(1.08)}
.play svg{width:100%;height:100%;display:block}
.back{position:absolute;top:2.2%;right:1.8%;z-index:3;display:none;align-items:center;gap:.5em;font-size:clamp(12px,1.5vw,20px);color:var(--cream);background:rgba(31,58,46,.82);border:1px solid rgba(255,235,180,.5);border-radius:999px;padding:.5em 1.1em;cursor:pointer;backdrop-filter:blur(4px);font-family:inherit}
.back.on{display:flex}
.qtop{right:11.5%;display:none;background:linear-gradient(#2c5340,#1b3a2d);border-color:#d9b45a;font-weight:700}.qtop.on{display:flex}.qtop .qstar{color:#f5dc94}.qtop.done::after{content:"✓";color:#f5dc94;margin-right:.2em}
.back:hover{background:rgba(31,58,46,.95)}
.modal{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(20,17,12,.55)}
.modal.on{display:flex}
.card{background:var(--cream);color:var(--ink);border:2px solid var(--gold);border-radius:18px;padding:3% 4%;text-align:center;max-width:70%;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:pop .3s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.card h2{margin:0 0 .15em;font-size:clamp(20px,3.2vw,46px)}
.card .en{font-size:clamp(14px,1.9vw,26px);font-style:italic;margin-bottom:.9em}
.card p{margin:0 0 1.1em;font-size:clamp(12px,1.5vw,20px);opacity:.8}
.card #mchoices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:1em}.card .mcx{background:transparent;color:var(--ink);border:1px solid rgba(31,58,46,.4)}.card button{font:inherit;font-size:clamp(12px,1.5vw,20px);background:var(--green);color:#fff;border:0;border-radius:999px;padding:.5em 1.6em;cursor:pointer}
.t3{display:none}.t3.on{display:block}
.haze{position:absolute;pointer-events:none;backdrop-filter:blur(16px) brightness(1.06) saturate(.85);-webkit-backdrop-filter:blur(16px) brightness(1.06) saturate(.85);-webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 52%,transparent 71%);mask-image:radial-gradient(ellipse at 50% 50%,#000 52%,transparent 71%)}
#mv{position:absolute;background:transparent;--poster-color:transparent;cursor:grab;outline:none}#mv:active{cursor:grabbing}
.hint{position:absolute;display:flex;align-items:center;justify-content:center;color:#fff8e4;font-size:clamp(10px,1.45vw,20px);background:rgba(31,58,46,.78);border:1px solid rgba(255,235,180,.45);border-radius:999px;pointer-events:none;transition:opacity .8s;white-space:nowrap}
.hint.off{opacity:0}
.toast{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);z-index:6;background:rgba(31,58,46,.92);color:#fff8e4;border:1px solid rgba(255,235,180,.5);border-radius:999px;padding:.5em 1.4em;font-size:clamp(12px,1.6vw,22px);opacity:0;pointer-events:none;transition:opacity .3s}
.toast.on{opacity:1}
.qbtn{position:absolute;display:flex;align-items:center;justify-content:center;gap:.5em;font:inherit;font-weight:700;font-size:clamp(9px,1.45vw,21px);color:#fff8e4;background:linear-gradient(#2c5340,#1b3a2d);border:2px solid #d9b45a;border-radius:999px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .2s,filter .2s}
.qbtn:hover{transform:scale(1.04);filter:brightness(1.12)}.qbtn:focus-visible{outline:3px solid #fff3c4;outline-offset:2px}
.qbtn .qstar{color:#f5dc94}.qbtn.done .qt::after{content:" ✓";color:#f5dc94}
#badges .bdg{position:absolute;pointer-events:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
#badges .bdg svg{width:100%;height:100%;display:block}
#badges .bdg.new{animation:bpop .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes bpop{from{transform:scale(0) rotate(-40deg);opacity:0}}
.qm{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(20,17,12,.72);padding:12px;box-sizing:border-box;overflow:auto}
.qm.on{display:flex}
.qcard{background:var(--cream);color:var(--ink);border:2px solid var(--gold);border-radius:18px;padding:clamp(16px,3vw,32px);width:min(100%,660px);box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .3s ease;text-align:right;margin:auto}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:clamp(12px,1.6vw,16px);opacity:.8;margin-bottom:12px}
.qbar{height:6px;background:rgba(31,58,46,.15);border-radius:99px;overflow:hidden;margin-bottom:clamp(12px,2vw,20px)}
.qbar i{display:block;height:100%;background:var(--green);transition:width .3s}
.qq{margin:0 0 clamp(12px,2vw,18px);font-size:clamp(17px,2.4vw,26px);line-height:1.55;font-weight:700}
.qo{display:block;width:100%;text-align:right;font:inherit;font-size:clamp(15px,2vw,20px);color:var(--ink);background:#fff;border:1.5px solid rgba(31,58,46,.3);border-radius:12px;padding:clamp(9px,1.4vw,13px) 16px;margin:0 0 10px;cursor:pointer}
.qo:hover:not(:disabled){background:#eef3ea}.qo:focus-visible{outline:3px solid var(--gold)}
.qo:disabled{cursor:default}.qo.ok{background:#d9efd2;border-color:#3d8a4a}.qo.no{background:#f6d8d3;border-color:#b5483c}
.qfb{min-height:1.6em;margin:4px 0 12px;font-size:clamp(14px,1.8vw,18px);font-weight:700}
.qfb.ok{color:#2c7a3b}.qfb.no{color:#a33b30}
.qbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.qb{font:inherit;font-size:clamp(14px,1.8vw,18px);background:var(--ink);color:#fff8e4;border:0;border-radius:999px;padding:10px 26px;cursor:pointer}
.qb.alt{background:transparent;color:var(--ink);border:1px solid rgba(31,58,46,.4)}
.qres{text-align:center}.qres h2{margin:8px 0 4px;font-size:clamp(20px,3vw,32px)}
.qres p{margin:0 0 16px;font-size:clamp(14px,1.9vw,19px);line-height:1.6}
.qres .bigb{width:clamp(110px,18vw,150px);margin:0 auto;animation:bpop .9s cubic-bezier(.2,1.4,.4,1);filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
.qres .score{font-size:clamp(34px,6vw,56px);font-weight:800;color:var(--ink);margin:6px 0}
.vm{background:rgba(10,8,5,.86)}.vwrap{height:88%;display:flex;flex-direction:column;align-items:center;gap:2.5%;animation:pop .3s ease}#vid{height:90%;aspect-ratio:1/1;background:#000;border:2px solid var(--gold);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);display:block}.vclose{font:inherit;font-size:clamp(11px,1.5vw,19px);color:var(--cream);background:rgba(31,58,46,.92);border:1px solid rgba(255,235,180,.5);border-radius:999px;padding:.4em 1.6em;cursor:pointer}
.mute{position:absolute;top:2.2%;left:1.8%;z-index:4;width:clamp(30px,3.4vw,46px);height:clamp(30px,3.4vw,46px);display:flex;align-items:center;justify-content:center;padding:0;color:var(--cream);background:rgba(31,58,46,.82);border:1px solid rgba(255,235,180,.5);border-radius:50%;cursor:pointer;backdrop-filter:blur(4px)}
.mute:hover{background:rgba(31,58,46,.95)}.mute:focus-visible{outline:3px solid #fff3c4;outline-offset:2px}
.mute svg{width:58%;height:58%}.mute .sl{display:none}.mute.off .sl{display:inline}.mute.off .wv{display:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
@media(prefers-reduced-motion:reduce){.go{animation:none}.scr{transition:none}}

function tone(f,t0,d,type,vol,f2){var c=AC;if(!c)return;var o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,c.currentTime+t0);

 s.connect(bp);bp.connect(g);g.connect(master);s.start(c.currentTime+t0)}
